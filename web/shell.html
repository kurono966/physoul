<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>$GODOT_PROJECT_NAME</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101a22'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%238ad0c3' stroke-width='3'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#101a22;color:#dbe7e8;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100%;height:100%;outline:none}#cover{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 40% 35%,#263a43,#101a22 75%);padding:24px}article{max-width:580px}h1{font-size:clamp(40px,8vw,72px);letter-spacing:.13em;color:#e5d4ae;margin:0 0 12px}p{line-height:1.9;color:#a9bec4}button{background:#8ad0c3;color:#10252a;border:0;border-radius:5px;padding:16px 38px;font-size:18px;font-weight:650;cursor:pointer}button:disabled{opacity:.55;cursor:wait}small{display:block;margin-top:22px;color:#8199a2;line-height:1.8}#status{min-height:24px;color:#e5d4ae}#error{white-space:pre-wrap;color:#f7b2a7}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<section id="cover"><article><h1>PHYSOUL</h1><p>武器の重さと接触、体勢をめぐる2Dアクション。<br>キーボード＋マウス／ゲームパッド対応。</p><button id="play">プレイ</button><p id="status">読み込み後、ゲーム画面をクリックすると操作を開始します。</p><small>WASD 移動 · マウス 視点 · クリック 斬撃 · 長押し 突き<br>右クリック ガード · Shift 回避 · Tab ロックオン · H 操作説明<br>ゲームパッド：A 回避 · RB 攻撃 · RT 強攻撃 · LT 衝撃波 · LB ガード<br>Escでマウスを解除。ゲーム画面を再クリックして操作を再開。</small><p id="error" role="alert"></p></article></section>
<script src="$GODOT_URL"></script>
<script>
const config=$GODOT_CONFIG;
const engine=new Engine(config);
const play=document.getElementById('play');
play.addEventListener('click',async()=>{
 play.disabled=true;document.getElementById('error').textContent='';
 try{
  const missing=Engine.getMissingFeatures({threads:false});
  if(missing.length)throw new Error('このブラウザーでは実行できません: '+missing.join(', '));
  await engine.startGame({canvas:document.getElementById('canvas'),onProgress:(done,total)=>{document.getElementById('status').textContent=total?'読み込み中 '+Math.round(done/total*100)+'%':'ゲームを準備しています…';}});
  document.getElementById('cover').style.display='none';document.getElementById('canvas').focus();
 }catch(error){document.getElementById('error').textContent=String(error);play.disabled=false;}
});
</script>
</body></html>
