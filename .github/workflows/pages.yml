name: Build and deploy Web game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6.3 and Web templates
        shell: bash
        run: |
          set -euo pipefail
          release=https://github.com/godotengine/godot/releases/download/4.6.3-stable
          curl -fL --retry 3 "$release/Godot_v4.6.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          curl -fL --retry 3 "$release/Godot_v4.6.3-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          unzip -j -q /tmp/templates.tpz 'templates/web_nothreads_release.zip' 'templates/version.txt' -d "$HOME/.local/share/godot/export_templates/4.6.3.stable"
      - name: Import and export
        run: |
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --editor --path . --quit
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script tests/maps.gd
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script tests/dungeon.gd
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script tests/corpses.gd
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script tests/sprint.gd
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script tests/vision.gd
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script tests/lock_switch.gd
          mkdir -p build/web
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . --export-release Web build/web/index.html
          touch build/web/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
